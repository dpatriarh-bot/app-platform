# ============================================================
# docker-compose.yml — оркестрация dev-окружения
# Проект: Улыбка ребёнка
# Сервисы: postgres, redis, minio, api, worker, web, nginx
#
# ВАЖНО: официальные образы MinIO (minio/minio, minio/mc)
# удалены с Docker Hub, а quay.io требует авторизации.
# Используется community-сборка netvark/minio:latest,
# которая автоматически собирается из официального
# исходного кода MinIO [citation:18].
#
# Сервис minio-init убран: официальный minio/mc удалён.
# Бакет `ulybka` создаётся один раз вручную через консоль
# http://localhost:9001 после первого запуска.
# ============================================================

name: ulybka

services:

  postgres:
    image: postgres:16-alpine
    container_name: ulybka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ulybka}
      POSTGRES_USER: ${POSTGRES_USER:-ulybka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ulybka} -d ${POSTGRES_DB:-ulybka}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ulybka-net

  redis:
    image: redis:7-alpine
    container_name: ulybka-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ulybka-net

  minio:
    # Community-сборка из официального исходного кода MinIO.
    # Автоматически обновляется ежедневно на Docker Hub.
    # Замена официального minio/minio, который удалён.
    image: netvark/minio:latest
    container_name: ulybka-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # netvark/minio использует curl для healthcheck,
      # а не mc ready local (mc в образе нет).
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ulybka-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: ${API_BUILD_TARGET:-development}
    container_name: ulybka-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-ulybka}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ulybka}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - ./apps/api/uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ulybka-net

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: ${API_BUILD_TARGET:-development}
    container_name: ulybka-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-ulybka}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ulybka}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ulybka-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: ${WEB_BUILD_TARGET:-development}
    container_name: ulybka-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_PROXY_TARGET: http://api:3000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api
    networks:
      - ulybka-net

  nginx:
    image: nginx:1.28-alpine
    container_name: ulybka-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - api
      - web
    networks:
      - ulybka-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  ulybka-net:
    driver: bridge