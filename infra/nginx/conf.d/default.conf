# ============================================================
# default.conf — виртуальные хосты
# HTTP → HTTPS redirect, HTTPS-сервер с CSP и rate-limit,
# upstream на api и web, WebSocket для Vite HMR.
# ============================================================

upstream ulybka_api {
    server api:3000;
    keepalive 32;
}

upstream ulybka_web {
    server web:5173;
    keepalive 32;
}

# ---------- HTTP → HTTPS ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME-challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health напрямую (не через HTTPS — удобно для curl)
    location = /health {
        proxy_pass http://ulybka_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /health/live {
        proxy_pass http://ulybka_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self' ws://localhost wss://localhost ws://127.0.0.1 wss://127.0.0.1;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
        upgrade-insecure-requests
    " always;

    # Лимиты
    limit_conn conn 50;
    limit_req zone=global burst=60 nodelay;

    # HTTP/2 tuning
    http2_max_field_size 64k;
    http2_max_header_size 128k;
    http2_max_requests 1000;
    http2_recv_timeout 30s;

    # ---------- Health (HTTPS, для тестов из браузера) ----------
    location = /health {
        proxy_pass http://ulybka_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /health/live {
        proxy_pass http://ulybka_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---------- Vite HMR WebSocket ----------
    # Должен идти ДО location / и location /api/
    location / {
        proxy_pass http://ulybka_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        proxy_max_temp_file_size 0;
    }

    # ---------- WebSocket для API ----------
    location /ws/ {
        proxy_pass http://ulybka_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- Auth (жёсткий rate-limit) ----------
    location /api/v1/auth/ {
        limit_req zone=auth burst=3 nodelay;

        proxy_pass http://ulybka_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- API ----------
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://ulybka_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        client_max_body_size 20m;
    }

    # ---------- Кэш статики ----------
    location /assets/ {
        proxy_pass http://ulybka_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- Запрет служебных файлов ----------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}